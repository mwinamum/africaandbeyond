<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Track your enquiry | Carnivores Safaris</title><link rel="icon" href="assets/logo.png"><style>body{background:#f6f3eb;color:#23392c;font:16px/1.7 system-ui;margin:0}main{max-width:620px;margin:40px auto;padding:25px}img{width:120px}h1{font:44px Georgia}label{display:block;margin:20px 0}input{display:block;width:100%;box-sizing:border-box;padding:14px;border:1px solid #bac4b5;font:inherit}button{background:#23392c;color:white;border:0;padding:15px 24px;font:inherit;cursor:pointer}a{color:inherit}#result{padding:20px 0}small{display:block;color:#657263}</style><main><a href="index.html"><img src="assets/logo.png" alt="Carnivores Safaris"></a><h1>Your journey starts here.</h1><p>Check your enquiry using the reference you received and the email address you submitted.</p><form><label>Enquiry reference<input name="reference" required pattern="INQ-[0-9-]+" placeholder="INQ-20261103-3003"></label><label>Email address<input name="email" type="email" autocomplete="email" required></label><button>Check enquiry</button></form><div id="result" role="status" aria-live="polite"></div><small>An enquiry is a request for a proposal, not a confirmed booking.</small><p><a href="index.html">← Return to Carnivores Safaris</a></p></main><script src="/localisation.js"></script><script>const form=document.querySelector('form'),result=document.querySelector('#result');form.elements.reference.value=new URLSearchParams(location.search).get('reference')||'';form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;result.textContent='Checking…';try{const r=await fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:form.elements.reference.value.trim(),email:form.elements.email.value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.message);result.textContent='Enquiry '+d.inquiryNumber+' is recorded. '+(d.isConverted?'Your enquiry has progressed. Contact the team for the latest proposal or booking details.':'The team has your enquiry. Contact them with this reference for an update.')}catch(e){result.textContent=e.message||'Unable to check your enquiry right now.'}finally{b.disabled=false}};</script></html>
